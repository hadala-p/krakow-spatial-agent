[project]
name = "krakow-spatial-agent"
version = "0.1.0"
description = "Spatial RAG and Text-to-PostGIS Agent for Krakow Transit Data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "greenlet>=3.5.6",
    "sqlalchemy>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (automatic import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (Python 3.12+ modern syntax)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
